[workspace]
resolver = "3"
members = [
    "crates/embun-render",
    "crates/embun-motion",
    "crates/embun",
    "crates/embun-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/fikrifirmanf/embun"
keywords = ["wgpu", "glass", "gui", "blur", "shader"]
categories = ["gui", "rendering", "graphics"]

[workspace.dependencies]
embun-render = { path = "crates/embun-render", version = "0.1.0" }
embun-motion = { path = "crates/embun-motion", version = "0.1.0" }
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
png = "0.18"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winit = "0.30.13"
taffy = "0.15.1"
glyphon = "0.12.0"
arboard = { version = "3", default-features = false }
accesskit = "0.25.2"
accesskit_winit = "0.34.2"

[profile.release]
opt-level = "s"
lto = true

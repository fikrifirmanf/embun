<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Embun</title>
<meta name="description" content="Embun is a Rust UI toolkit with glass controls that match macOS 27, drawn with wgpu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11 9 16a9 9 0 0 1-18 0c0-5 4-9 9-16z' fill='%230a60d0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var saved = localStorage.getItem("embun-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="./">Embun</a>
  <div class="search">
    <label class="sr" for="q">Search the docs</label>
    <input id="q" type="search" placeholder="Search" autocomplete="off" aria-controls="results">
    <ul id="results" hidden></ul>
  </div>
  <nav class="links" aria-label="Project">
    <a href="https://github.com/fikrifirmanf/embun">GitHub</a>
    <a href="https://docs.rs/embun">API reference</a>
    <a href="https://crates.io/crates/embun">crates.io</a>
  </nav>
  <button class="mode" type="button" id="mode" aria-label="Switch between light and dark previews">
    <span class="mode-light">Light</span><span class="mode-dark">Dark</span>
  </button>
</header>
<div class="shell">
  <nav class="side" aria-label="Pages"><ul>{{nav}}</ul></nav>
  <main id="main">
    <h1>{{title}}</h1>
    {{content}}
  </main>
</div>
<script>
  (function () {
    var root = document.documentElement;
    function current() {
      return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    var input = document.getElementById("q"), results = document.getElementById("results"), index = null;
    function load(then) {
      if (index) return then();
      fetch("search.json").then(function (r) { return r.json(); }).then(function (data) { index = data; then(); }).catch(function () {});
    }
    function show() {
      var terms = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      results.textContent = "";
      if (!terms.length || !index) { results.hidden = true; return; }
      var hits = [];
      index.forEach(function (e) {
        var heading = (e.heading || e.page).toLowerCase(), all = heading + " " + e.text.toLowerCase();
        if (terms.every(function (t) { return all.indexOf(t) >= 0; })) {
          hits.push({ e: e, score: terms.filter(function (t) { return heading.indexOf(t) >= 0; }).length });
        }
      });
      hits.sort(function (a, b) { return b.score - a.score; });
      hits.slice(0, 8).forEach(function (h) {
        var li = document.createElement("li"), a = document.createElement("a"), t = document.createElement("span"), p = document.createElement("span");
        a.href = h.e.href;
        t.className = "r-title"; t.textContent = h.e.heading || h.e.page;
        p.className = "r-page"; p.textContent = h.e.heading ? h.e.page : "Page";
        a.append(t, p); li.append(a); results.append(li);
      });
      if (!hits.length) {
        var none = document.createElement("li"); none.className = "none"; none.textContent = "No results"; results.append(none);
      }
      results.hidden = false;
    }
    input.addEventListener("focus", function () { load(show); });
    input.addEventListener("input", function () { load(show); });
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") { input.value = ""; show(); }
      if (ev.key === "ArrowDown") { var a = results.querySelector("a"); if (a) { a.focus(); ev.preventDefault(); } }
      if (ev.key === "Enter") { var f = results.querySelector("a"); if (f) location.href = f.href; }
    });
    results.addEventListener("keydown", function (ev) {
      var a = document.activeElement;
      if (ev.key === "ArrowDown" && a.parentNode.nextElementSibling) { a.parentNode.nextElementSibling.querySelector("a").focus(); ev.preventDefault(); }
      if (ev.key === "ArrowUp") { var prev = a.parentNode.previousElementSibling; (prev ? prev.querySelector("a") : input).focus(); ev.preventDefault(); }
      if (ev.key === "Escape") { input.focus(); input.value = ""; show(); }
    });
    document.addEventListener("click", function (ev) { if (!ev.target.closest(".search")) results.hidden = true; });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); input.focus(); }
    });
    document.getElementById("mode").addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("embun-theme", next); } catch (e) {}
    });
  })();
</script>
</body>
</html>

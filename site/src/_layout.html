<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Embun</title>
<meta name="description" content="Embun is a Rust UI toolkit with glass controls that match macOS 27, drawn with wgpu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11 9 16a9 9 0 0 1-18 0c0-5 4-9 9-16z' fill='%230a60d0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var saved = localStorage.getItem("embun-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="./">Embun</a>
  <nav class="links" aria-label="Project">
    <a href="https://github.com/fikrifirmanf/embun">GitHub</a>
    <a href="https://docs.rs/embun">API reference</a>
    <a href="https://crates.io/crates/embun">crates.io</a>
  </nav>
  <button class="mode" type="button" id="mode" aria-label="Switch between light and dark previews">
    <span class="mode-light">Light</span><span class="mode-dark">Dark</span>
  </button>
</header>
<div class="shell">
  <nav class="side" aria-label="Pages"><ul>{{nav}}</ul></nav>
  <main id="main">
    <h1>{{title}}</h1>
    {{content}}
  </main>
</div>
<script>
  (function () {
    var root = document.documentElement;
    function current() {
      return root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    document.getElementById("mode").addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("embun-theme", next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
